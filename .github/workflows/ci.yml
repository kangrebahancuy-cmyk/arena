name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The project is developed on Windows, so Windows is tested as a first-class platform.
        os: [ubuntu-latest, windows-latest]
        # Both supported "engines" lines: the oldest maintained (22) and the newest LTS (24).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Installs exactly what package-lock.json says and fails if it is out of sync with package.json.
      - run: npm ci

      # typecheck + lint + format check + all tests
      - run: npm run check

      # Proves that the production bundles (server and client) can be built.
      - run: npm run build
